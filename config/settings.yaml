    login_fields:
      username: numerKarty
      password: haslo
    captcha_sitekey: 0x4AAAAAADTtsdegaTVr09jb
    request_delay_ms: 1500
    max_retries: 3

delta:
  enabled: true
  hash_algorithm: sha256

ocr:
  enabled: false        # set true when OCR pipeline is configured
  engine: tesseract
  language: pol+eng

logging:
  level: INFO
  console: true
  file: true
